[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "scripts/archive",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF"]
ignore = ["E501", "B008", "RUF012", "B007", "RUF001", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["BLE001", "B023", "F841", "RUF046", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zentinel"
version = "0.4.0"
description = "Zentinel AIOps - real-time log anomaly detection and incident investigation platform (IBM Z Datathon 2026)"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
